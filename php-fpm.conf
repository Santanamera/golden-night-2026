[global]
pid = /tmp/php-fpm.pid
daemonize = no
event.mechanism = epoll

[www]
listen = 127.0.0.1:9000
listen.allowed_clients = 127.0.0.1
user = root
group = root
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
chdir = /
catch_workers_output = yes
